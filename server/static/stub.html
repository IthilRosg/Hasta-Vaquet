<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AiryDeck</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #333;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      padding: 40px 20px;
    }
    .logo {
      font-size: 28px;
      font-weight: 700;
      color: #111;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }
    .tagline {
      font-size: 15px;
      color: #666;
      margin-bottom: 32px;
    }
    .status {
      display: inline-block;
      padding: 8px 20px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      color: #888;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #22c55e;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">AiryDeck</div>
    <div class="tagline">Private infrastructure services</div>
    <div class="status">
      <span class="dot"></span>All systems operational
    </div>
  </div>
</body>
</html>
